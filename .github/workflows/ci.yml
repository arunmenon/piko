name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20.11.0, 22]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Install bubblewrap (Linux sandbox provider)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Lockfile agrees with workspace manifests
        run: |
          node -e '
            const { readFileSync } = require("node:fs");
            const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
            for (const dir of ["packages/ai", "packages/core", "packages/cli"]) {
              const manifest = JSON.parse(readFileSync(`${dir}/package.json`, "utf8"));
              const locked = lock.packages[dir]?.version;
              if (locked !== manifest.version) {
                console.error(`${dir}: lockfile has ${locked}, manifest has ${manifest.version}; run npm install and commit the lockfile`);
                process.exit(1);
              }
            }
          '
      - name: Seatbelt exec diagnostics (macOS only, informational)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          set +e
          echo "node: $(node -e 'console.log(process.execPath)') -> $(node -e 'console.log(require("fs").realpathSync(process.execPath))')"
          echo "bash: $(command -v bash) -> $(node -e 'console.log(require("fs").realpathSync(process.argv[1]))' "$(command -v bash)")"
          sw_vers
          for profile in '(version 1)(allow default)' \
            '(version 1)(deny default)(allow process-exec)(allow process-fork)(allow file-read*)(allow sysctl-read)(allow mach-lookup)' \
            '(version 1)(deny default)(allow process-exec)(allow process-fork)(allow file-read*)(allow sysctl-read)' \
            '(version 1)(deny default)(allow process-exec* (literal "/bin/bash"))(allow process-fork)(allow file-read*)(allow sysctl-read)'; do
            echo "--- profile: $profile"
            sandbox-exec -p "$profile" /bin/bash -c 'echo bash-ok' 2>&1 | head -3
            sandbox-exec -p "$profile" node -e 'require("child_process").spawnSync("/bin/bash",["-c","echo node-spawn-ok"],{stdio:"inherit"})' 2>&1 | head -3
          done
          log show --last 3m --predicate 'process == "sandboxd" OR subsystem == "com.apple.sandbox.reporting"' 2>/dev/null | rg -i 'deny' | head -20
      - run: npm test
      - run: npm run check-budget
      - name: Benchmark manifest matches results.json
        run: python3 bench/tb20_manifest.py docs/benchmarks/2026-08-25-tb20/results.json --check docs/benchmarks/2026-08-25-tb20/manifest.md
      - name: Verify publish contents
        if: matrix.node == 22 && matrix.os == 'ubuntu-latest'
        run: npm run pack:dry-run
