name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20.11.0, 22]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Lockfile agrees with workspace manifests
        run: |
          node -e '
            const { readFileSync } = require("node:fs");
            const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
            for (const dir of ["packages/ai", "packages/core", "packages/cli"]) {
              const manifest = JSON.parse(readFileSync(`${dir}/package.json`, "utf8"));
              const locked = lock.packages[dir]?.version;
              if (locked !== manifest.version) {
                console.error(`${dir}: lockfile has ${locked}, manifest has ${manifest.version}; run npm install and commit the lockfile`);
                process.exit(1);
              }
            }
          '
      - run: npm test
      - run: npm run check-budget
      - name: Verify publish contents
        if: matrix.node == 22 && matrix.os == 'ubuntu-latest'
        run: npm run pack:dry-run
